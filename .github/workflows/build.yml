name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y cmake ninja-build gcc-c++ extra-cmake-modules qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kauth-devel kf6-kcoreaddons-devel plasma-devel nextdns NetworkManager systemd
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: qmllint-qt6 package/contents/config/config.qml package/contents/ui/configGeneral.qml package/contents/ui/main.qml
